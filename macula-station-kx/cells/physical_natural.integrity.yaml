id: physical_natural.integrity
status: assumed
owner: raf.lefever@erlef.org
threat:
  definition: 'The physical world corrupts the station: heat, power spikes, cosmic rays and aging hardware damage storage and memory, silently altering what the station holds and serves.'
  manifestations:
  - A power surge corrupts the identity volume
  - Sustained heat ages the disks into bit errors
  - Cosmic-ray bit flips in RAM pass through to stored records
defense:
  detection:
  - measure: Verification on read refuses records a fault corrupted
    status: by_design
    source: macula-io/macula plans/DESIGN_PQ_SIGNED_FRAMES_AND_RECORDS.md
  countermeasures:
  - measure: ECC memory and monitored hardware on station boxes
    status: org
  - measure: Backups of the identity volume, taken and tested
    status: org
  recovery:
  - measure: Restore the volume, re-enroll if needed, let peers re-fill the DHT
    status: org
