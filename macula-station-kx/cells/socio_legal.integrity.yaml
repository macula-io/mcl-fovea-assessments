id: socio_legal.integrity
status: assessed
owner: raf.lefever@erlef.org
threat:
  definition: 'Legal or political pressure corrupts the system''s integrity: an authority forces a change to the station''s configuration, a content-removal order compels deletion, or sanctions cut the operator off from updates.'
  manifestations:
  - A court orders records removed from the DHT
  - An authority forces a wiretap configuration onto the box
  - Sanctions block the registries and repos the station depends on
defense:
  detection:
  - measure: Fleet config changes are signed tags; a compelled change would have to be signed and is reviewable in git history
    status: by_design
    source: macula-io/macula-fleet
  countermeasures:
  - measure: Signed records and tombstones make every removal attributable and visible
    status: by_design
    source: macula-io/macula plans/DESIGN_PQ_SIGNED_FRAMES_AND_RECORDS.md
    evidence:
    - kind: test
      ref: macula-io/macula test/macula_record_cbor_strict_tests.erl (duplicate_key_at_the_top_level_is_refused_test)
  - measure: The keeper's public archive records what was removed and when
    status: by_design
    source: macula-io/mcl-fovea-records
  recovery:
  - measure: Re-publish from peers and the kept history once the pressure lifts
    status: org
