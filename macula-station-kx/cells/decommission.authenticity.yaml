id: decommission.authenticity
status: assessed
owner: raf.lefever@erlef.org
threat:
  definition: 'A retired station''s identity outlives it: its key still verifies, its records still circulate, and nothing tells peers the station is gone, so its name can be taken over.'
  manifestations:
  - The retired station's node id is still pinned in client configs
  - Its key, if it leaks later, can still sign as the station
  - No tombstone marks its records withdrawn
defense:
  detection:
  - measure: Tombstones retire a station's records; readers check them
    status: by_design
    source: macula-io/macula plans/DESIGN_PQ_SIGNED_FRAMES_AND_RECORDS.md
  countermeasures:
  - measure: Decommissioning publishes the tombstones and unpins the node id
    status: org
    evidence:
    - kind: test
      ref: macula-io/macula-realm apps/project_realm/test/project_realm/realm_membership_revoked_v1_to_realm_members_test.exs
  - measure: Client configs are re-pinned to live stations
    status: org
  recovery:
  - measure: Publish the missing tombstones; re-pin clients; retire the key
    status: org
