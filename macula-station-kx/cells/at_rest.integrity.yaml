id: at_rest.integrity
status: assessed
owner: raf.lefever@erlef.org
threat:
  definition: 'Data on the station''s disk is altered while it rests: a stored record is modified, a config is edited between boots, or the identity volume is corrupted.'
  manifestations:
  - A stored record is flipped on disk and served with a broken signature
  - A config file is edited on the box between reconciler runs
  - Disk corruption damages the identity volume
defense:
  detection:
  - measure: Readers verify records against signatures and refuse corrupt ones
    status: by_design
    source: macula-io/macula plans/DESIGN_PQ_SIGNED_FRAMES_AND_RECORDS.md
  - measure: The reconciler re-applies canonical config and refuses non-canonical files
    status: by_design
    source: macula-io/macula-fleet
  countermeasures:
  - measure: Signed records make at-rest tampering detectable everywhere
    status: by_design
    source: macula-io/macula plans/DESIGN_PQ_SIGNED_FRAMES_AND_RECORDS.md
    evidence:
    - kind: test
      ref: macula-io/macula test/macula_record_cbor_strict_tests.erl (duplicate_key_at_the_top_level_is_refused_test)
  - measure: Backups of the identity volume, taken and tested
    status: org
  recovery:
  - measure: Restore the volume from backup or re-enroll the station
    status: org
